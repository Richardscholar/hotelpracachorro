<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Hotel Bom Pra Cachorro</title>
  <link rel="stylesheet" href="cadastro.css">
</head>
<body class="login-page">

  <!-- HEADER -->
  <header>
    <a href="index.html" class="logo">
      <span class="logo-icon">🐾</span>
      <span>HOTEL BOM PRA CACHORRO</span>
    </a>
  </header>

  <!-- MAIN -->
  <main>
    <div class="login-container">
      <div class="login-card">

        <!-- LOGO -->
        <div class="login-logo">🐶❤️</div>

        <!-- TÍTULO -->
        <h2>CADASTRO</h2>
        <p class="login-subtitle">Bom Pra Cachorro</p>

        <!-- FORM -->
        <form class="login-form" id="cadastroForm" method="POST" action="cadastro.php">
          <div class="form-group">
            <input type="text" name="nome" placeholder="Nome Completo" required>
          </div>

          <div class="form-group">
            <input type="email" name="email" placeholder="Email" required>
          </div>

          <div class="form-group">
            <input type="password" name="senha" placeholder="Senha" required>
          </div>

          <div class="form-group">
            <input type="password" name="confirmarSenha" placeholder="Confirmar Senha" required>
          </div>

          <button type="submit" class="btn btn-primary btn-login">Cadastrar</button>
        </form>

        <div class="forgot-password">
          <a href="login.html">Já possui conta? Faça login 🐾</a>
        </div>

      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>

      </a>
    </div>
  </footer>

</body>
</html>
